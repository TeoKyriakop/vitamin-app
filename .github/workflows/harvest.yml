name: Άντληση δεδομένων και δημοσίευση

on:
  schedule:
    - cron: "17 3 * * *"        # κάθε μέρα 03:17 UTC, σε δόσεις (HARVEST_LIMIT)
  workflow_dispatch:             # χειροκίνητα από την καρτέλα Actions
    inputs:
      all:
        description: "Ανανέωση όλων των καταχωρίσεων (όχι μόνο των παλιών)"
        type: boolean
        default: false
      kind:
        description: "Νέα αναζήτηση: είδος (i, s, h, f). Το συμπληρώνει το Cloudflare Worker"
        required: false
        default: ""
      q:
        description: "Νέα αναζήτηση: όνομα"
        required: false
        default: ""
      en:
        description: "Νέα αναζήτηση: όρος στα αγγλικά"
        required: false
        default: ""
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  # Οι νέες αναζητήσεις τρέχουν παράλληλα με την καθημερινή άντληση, μία ομάδα ανά όρο
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.en != '' && format('discover-{0}-{1}', inputs.kind, inputs.en) || github.event_name == 'issues' && format('issue-{0}', github.event.issue.number) || 'harvest' }}
  cancel-in-progress: false
# Η δημοσίευση γίνεται από το deploy.yml (και αμέσως μετά από κάθε αλλαγή κώδικα)

jobs:
  harvest:
    # Νέα αίτηση προσθήκης: μόνο issues με τίτλο που ξεκινά από «Προσθήκη:»
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'Προσθήκη:')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      STACKEXCHANGE_KEY: ${{ secrets.STACKEXCHANGE_KEY }}
      PYTHONUNBUFFERED: "1"
      HARVEST_LIMIT: ${{ github.event_name == 'schedule' && '130' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Έλεγχοι
        working-directory: server
        run: python tests/test_offline.py

      - name: Άντληση (καθημερινή ή χειροκίνητη)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.en == '')
        working-directory: server
        run: python -m vitapp.harvest ${{ inputs.all && '--all' || '' }}

      - name: Άντληση νέας αναζήτησης (από την εφαρμογή ή από issue)
        if: github.event_name == 'issues' || (github.event_name == 'workflow_dispatch' && inputs.en != '')
        working-directory: server
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          DISCOVER_KIND: ${{ inputs.kind }}
          DISCOVER_Q: ${{ inputs.q }}
          DISCOVER_EN: ${{ inputs.en }}
        run: python -m vitapp.discover_issue | tee ../issue-result.txt

      - name: Αποθήκευση νέων δεδομένων στο repository
        run: |
          git config user.name "vitamin-bot"
          git config user.email "vitamin-bot@users.noreply.github.com"
          # τα παραγόμενα αρχεία της εφαρμογής τα χτίζει η δημοσίευση, δεν αποθηκεύονται εδώ
          git checkout -- app/data 2>/dev/null || true
          git clean -fdq app/data 2>/dev/null || true
          git add -A server/state
          if ! git diff --cached --quiet; then
            git commit -m "Ενημέρωση δεδομένων $(date -u +%F)"
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash && git push; then pushed=1; break; fi
              sleep $((i * 5))
            done
            [ "$pushed" = 1 ] || { echo "Η αποθήκευση απέτυχε"; exit 1; }
          fi

      - name: Απάντηση στο issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body-file issue-result.txt
          gh issue close "$ISSUE"

  deploy:
    needs: harvest
    uses: ./.github/workflows/deploy.yml
