name: Εφαρμογή Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Έκδοση (π.χ. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - name: Android SDK (προεγκατεστημένο στο GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Δεδομένα και ιστοσελίδα
        working-directory: server
        env: {GITHUB_REPOSITORY: "${{ github.repository }}"}
        run: |
          python -m vitapp.content
          python -m vitapp.harvest --build
          python -m vitapp.site ../site

      - name: Έργο Android
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          node build-www.mjs
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#12332B' --splashBackgroundColor '#EEF5F1' --splashBackgroundColorDark '#0E1A17'
          npx cap sync android
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"${{ inputs.version }}\"/" android/app/build.gradle
          sed -i -E "s/minSdkVersion = [0-9]+/minSdkVersion = 24/" android/variables.gradle   # Play requires 24+
          grep -E "versionCode|versionName|applicationId|minSdk|targetSdk" android/app/build.gradle android/variables.gradle || true

      - name: Υπογραφή και δημιουργία AAB/APK
        working-directory: mobile/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Λείπει το secret ANDROID_KEYSTORE_BASE64"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
          rm -f "$RUNNER_TEMP/upload.jks"
          ls -la app/build/outputs/bundle/release app/build/outputs/apk/release

      - uses: actions/upload-artifact@v4
        with:
          name: vitamin-compass-${{ inputs.version }}-${{ github.run_number }}
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
