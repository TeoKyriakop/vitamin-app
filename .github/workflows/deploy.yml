name: Δημοσίευση εφαρμογής

on:
  push:
    branches: [main]
    paths: ["app/**", "server/**", ".github/workflows/**"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main          # πάντα η τελευταία έκδοση, μαζί με τα νέα δεδομένα
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Έλεγχοι
        working-directory: server
        run: python tests/test_offline.py
      - name: Δημιουργία δεδομένων και ιστοσελίδας
        working-directory: server
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m vitapp.content
          python -m vitapp.harvest --build
          python -m vitapp.site ../site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
